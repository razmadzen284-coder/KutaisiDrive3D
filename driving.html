<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kutaisi Drive — სასწავლო მოძრაობა</title><style>body{margin:0;background:#091522;color:white;font-family:system-ui}header{padding:12px}button{padding:12px;border:1px solid #54839a;background:#18374b;color:white;border-radius:9px;font-weight:bold}button.active{background:#008cc4}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px}canvas{width:100%;display:block;background:#86bee0}#info{padding:12px;color:#c8e5f8}#actions{display:flex;gap:8px;padding:8px}small{color:#ffd98a}</style><header><b>🚗 სასწავლო მოძრაობა — მძღოლის ხედით</b><br><small>არ არის ოფიციალური მარშრუტების ზუსტი ვიდეო ან GPS ტრაექტორია</small></header><nav><button class="active" data-r="0">№1</button><button data-r="1">№2</button><button data-r="2">№3</button><button data-r="3">№4</button></nav><canvas id="c" width="900" height="510"></canvas><div id="info"></div><div id="actions"><button id="pause">⏸ პაუზა</button><button id="reset">↻ თავიდან</button><button id="speed">1×</button></div><script>
const cv=document.querySelector('canvas'),c=cv.getContext('2d'),sets=[['პირდაპირი გზა','ქვეითთა გადასასვლელი','მარცხნივ მოხვევა','ვიწრო გზა','ფინიში'],['მარჯვნივ მოხვევა','შუქნიშანი','მარჯვნივ მოხვევა','გადასასვლელი','ფინიში'],['დათმე გზა','წრიული მოძრაობა','წრიდან გამოსვლა','პირდაპირი გზა','ფინიში'],['გზაჯვარედინი','მარცხნივ მოხვევა','შუქნიშანი','მარჯვნივ მოხვევა','ფინიში']];let r=0,t=0,go=true,speed=1,last=0;const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)},poly=(p,col)=>{c.fillStyle=col;c.beginPath();p.forEach((v,i)=>i?c.lineTo(...v):c.moveTo(...v));c.closePath();c.fill()};function draw(ts){let dt=last?Math.min(.06,(ts-last)/1000):0;last=ts;if(go)t+=dt*speed;let st=Math.floor(t/8)%5,ph=(t%8)/8,label=sets[r][st],turn=label.includes('მარცხნივ')?-1:label.includes('მარჯვნივ')||label.includes('წრიულ')?1:0,b=turn*Math.sin(ph*Math.PI)*100;let grad=c.createLinearGradient(0,0,0,300);grad.addColorStop(0,'#65ace8');grad.addColorStop(1,'#d5f1ff');rect(0,0,900,510,grad);rect(0,260,900,250,'#79a36e');poly([[415+b,260],[485+b,260],[880,460],[20,460]],'#46515b');for(let i=0;i<9;i++){let z=((i/9+t*.065)%1),d=z*z,y=265+d*185,x=450+b*(1-z);rect(x-2-d*4,y,4+d*8,4+d*26,'#f5f1d6');for(let side of [-1,1]){let bx=450+side*(105+d*420)+b*(1-z),sz=12+d*85;rect(bx-sz/2,y-sz,sz,sz,'#d6d5ca');rect(bx-sz*.25,y-sz*.7,sz*.2,sz*.25,'#568bad');rect(bx+sz*.1,y-sz*.7,sz*.2,sz*.25,'#568bad');rect(bx+side*sz*.8,y-sz,sz*.09,sz,'#705138');c.beginPath();c.fillStyle='#3c8b51';c.arc(bx+side*sz*.8,y-sz*1.2,sz*.3,0,Math.PI*2);c.fill()}}if(label.includes('გადასასვლელ'))for(let i=-3;i<=3;i++){let y=310+ph*110;rect(450+i*43,y,29,11+ph*17,'#fff')}if(label.includes('შუქნიშან')){rect(685,150,8,165,'#454b52');rect(665,160,48,105,'#252b31');['#f44','#5b5b32','#3f5'].forEach((col,i)=>{c.beginPath();c.fillStyle=i===(ph<.5?0:2)?col:'#333';c.arc(689,180+i*32,11,0,7);c.fill()})}if(label.includes('წრიულ')){c.beginPath();c.strokeStyle='#fff';c.lineWidth=9;c.arc(450+b,285,40,0,7);c.stroke()}poly([[0,405],[200,395],[700,395],[900,405],[900,510],[0,510]],'#1c2a39');rect(320,423,260,58,'#0d1825');c.fillStyle='#e7f5ff';c.font='bold 27px system-ui';c.fillText(go?'35':'0',355,461);c.font='16px system-ui';c.fillText('კმ/სთ',417,459);c.strokeStyle='#111a23';c.lineWidth=25;c.beginPath();c.arc(450,535,120,3.45,5.95);c.stroke();document.getElementById('info').textContent='მარშრუტი №'+(r+1)+' • ეტაპი '+(st+1)+'/5 • '+label;requestAnimationFrame(draw)}document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{r=+x.dataset.r;t=0;document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',b===x))});document.querySelector('#pause').onclick=()=>{go=!go;document.querySelector('#pause').textContent=go?'⏸ პაუზა':'▶ გაგრძელება'};document.querySelector('#reset').onclick=()=>t=0;document.querySelector('#speed').onclick=()=>{speed=speed===1?2:1;document.querySelector('#speed').textContent=speed+'×'};requestAnimationFrame(draw);
</script></html>
